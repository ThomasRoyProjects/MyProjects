<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0d11; }
      .header-bg { fill: #131720; }
      .border { stroke: #232834; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f0ece3; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #b4bac5; line-height: 1.4; }
      .text-muted { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #9da3af; }
      .text-accent { font-family: "JetBrains Mono", monospace; font-size: 10.5px; fill: #c7b77a; }
      .col-bg { fill: #12151d; rx: 6px; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #f0ece3; }
      .card-bg { fill: #1a202c; stroke: #2d3545; stroke-width: 1; rx: 5px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
      .badge-p1 { fill: #dc2626; }
      .badge-p2 { fill: #d97706; }
      .badge-p3 { fill: #2563eb; }
      .badge-text { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .pill-bg { fill: #1f2535; rx: 10px; }
      .status-dot { fill: #10b981; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="600" class="bg" />

  <!-- Top App Navigation Bar -->
  <rect width="960" height="46" class="header-bg" />
  <line x1="0" y1="46" x2="960" y2="46" stroke="#232834" stroke-width="1" />

  <!-- App Brand -->
  <g transform="translate(24, 15)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#c7b77a" />
    <path d="M3 5 L8 9 L13 5 M3 5 L3 12 L13 12 L13 5 Z" fill="none" stroke="#090909" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="13" class="text-title" font-size="14">InboxBoard</text>
    <text x="110" y="13" class="text-muted">· Email-to-Kanban Service Desk</text>
  </g>

  <!-- Navigation Tabs -->
  <g transform="translate(360, 15)">
    <!-- Active Board Tab -->
    <rect x="0" y="-3" width="62" height="24" rx="4" fill="#1f2533" />
    <text x="12" y="13" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f0ece3">Board</text>
    <text x="80" y="13" font-family="-apple-system, sans-serif" font-size="12" fill="#b4bac5">Triage (1)</text>
    <text x="160" y="13" font-family="-apple-system, sans-serif" font-size="12" fill="#88909c">Settings</text>
  </g>

  <!-- Security & Local Status Pills -->
  <g transform="translate(700, 14)">
    <rect x="0" y="0" width="236" height="20" class="pill-bg" />
    <circle cx="12" cy="10" r="3.5" class="status-dot" />
    <text x="22" y="13.5" class="text-accent">IMAP IDLE · SQLCipher Encrypted</text>
  </g>

  <!-- Operations Toolbar Subheader -->
  <g transform="translate(24, 64)">
    <text x="0" y="14" class="text-muted" letter-spacing="1">OPERATIONS</text>
    <text x="0" y="36" class="text-title" font-size="18">Engineering Board</text>
    <text x="0" y="52" class="text-body">Local-first service workflow with schema-validated AI intake and encrypted persistence.</text>

    <!-- Mode switch tabs -->
    <g transform="translate(680, 18)">
      <rect x="0" y="0" width="232" height="28" rx="5" fill="#151922" stroke="#28303f" stroke-width="1" />
      <rect x="2" y="2" width="120" height="24" rx="4" fill="#222837" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f0ece3">Engineering (4)</text>
      <text x="134" y="18" font-family="-apple-system, sans-serif" font-size="11" fill="#88909c">Support (0)</text>
    </g>
  </g>

  <line x1="24" y1="130" x2="936" y2="130" stroke="#1f2533" stroke-width="1" />

  <!-- 4-Lane Kanban Board Layout -->
  <!-- Column 1: Triage (Review Queue) -->
  <g transform="translate(24, 144)">
    <rect width="216" height="432" class="col-bg" rx="6" />
    <!-- Col Header -->
    <circle cx="16" cy="20" r="4" fill="#f59e0b" />
    <text x="28" y="24" class="col-header">Triage</text>
    <rect x="182" y="12" width="20" height="16" rx="8" fill="#1f2430" />
    <text x="189" y="24" class="text-muted">1</text>
    <line x1="12" y1="36" x2="204" y2="36" stroke="#1f2533" stroke-width="1" />

    <!-- Card: Triage Item -->
    <g transform="translate(10, 46)" filter="url(#shadow)">
      <rect width="196" height="154" class="card-bg" stroke="#f59e0b" stroke-opacity="0.5" />
      <!-- Priority Badge + Ticket ID -->
      <rect x="12" y="12" width="24" height="16" rx="3" class="badge-p2" />
      <text x="16" y="24" class="badge-text">P2</text>
      <text x="44" y="24" class="text-muted">#INB-042</text>
      <text x="12" y="48" class="card-title">DB migration syntax conflict</text>
      <text x="12" y="66" class="text-body">Sender: dev-lead@internal</text>
      <text x="12" y="80" class="text-body">Requires human approval:</text>
      <rect x="12" y="88" width="172" height="20" rx="3" fill="#292012" stroke="#684b16" stroke-width="1" />
      <text x="16" y="102" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24">Flag: Migration keyword detected</text>
      <line x1="12" y1="118" x2="184" y2="118" stroke="#232834" stroke-width="1" />
      <text x="12" y="136" font-family="sans-serif" font-size="10" font-weight="600" fill="#c7b77a">Review &amp; Approve →</text>
    </g>
  </g>

  <!-- Column 2: Ready -->
  <g transform="translate(252, 144)">
    <rect width="216" height="432" class="col-bg" rx="6" />
    <circle cx="16" cy="20" r="4" fill="#3b82f6" />
    <text x="28" y="24" class="col-header">Ready</text>
    <rect x="182" y="12" width="20" height="16" rx="8" fill="#1f2430" />
    <text x="189" y="24" class="text-muted">1</text>
    <line x1="12" y1="36" x2="204" y2="36" stroke="#1f2533" stroke-width="1" />

    <!-- Card: Ready Item -->
    <g transform="translate(10, 46)" filter="url(#shadow)">
      <rect width="196" height="130" class="card-bg" />
      <rect x="12" y="12" width="24" height="16" rx="3" class="badge-p3" />
      <text x="16" y="24" class="badge-text">P3</text>
      <text x="44" y="24" class="text-muted">#INB-039</text>
      <text x="12" y="48" class="card-title">Bump container base image</text>
      <text x="12" y="66" class="text-body">Validated intake via IMAP IDLE</text>
      <text x="12" y="80" class="text-body">DMARC pass: mx.google.com</text>
      <rect x="12" y="92" width="102" height="18" rx="3" fill="#1b2a40" stroke="#2a4570" stroke-width="1" />
      <text x="16" y="104" font-family="JetBrains Mono, monospace" font-size="9" fill="#93c5fd">Schema Validated</text>
    </g>
  </g>

  <!-- Column 3: In Progress -->
  <g transform="translate(480, 144)">
    <rect width="216" height="432" class="col-bg" rx="6" />
    <circle cx="16" cy="20" r="4" fill="#8b5cf6" />
    <text x="28" y="24" class="col-header">In Progress</text>
    <rect x="182" y="12" width="20" height="16" rx="8" fill="#1f2430" />
    <text x="189" y="24" class="text-muted">1</text>
    <line x1="12" y1="36" x2="204" y2="36" stroke="#1f2533" stroke-width="1" />

    <!-- Card: In Progress Item -->
    <g transform="translate(10, 46)" filter="url(#shadow)">
      <rect width="196" height="130" class="card-bg" />
      <rect x="12" y="12" width="24" height="16" rx="3" class="badge-p1" />
      <text x="16" y="24" class="badge-text">P1</text>
      <text x="44" y="24" class="text-muted">#INB-037</text>
      <text x="12" y="48" class="card-title">IMAP retry backoff handler</text>
      <text x="12" y="66" class="text-body">Handling TLS disconnect events</text>
      <text x="12" y="80" class="text-body">Assignee: Thomas Roy</text>
      <rect x="12" y="92" width="100" height="18" rx="3" fill="#2d1f43" stroke="#4a3170" stroke-width="1" />
      <text x="16" y="104" font-family="JetBrains Mono, monospace" font-size="9" fill="#d8b4fe">Branch: fix/imap</text>
    </g>
  </g>

  <!-- Column 4: Done -->
  <g transform="translate(708, 144)">
    <rect width="216" height="432" class="col-bg" rx="6" />
    <circle cx="16" cy="20" r="4" fill="#10b981" />
    <text x="28" y="24" class="col-header">Done</text>
    <rect x="182" y="12" width="20" height="16" rx="8" fill="#1f2430" />
    <text x="189" y="24" class="text-muted">1</text>
    <line x1="12" y1="36" x2="204" y2="36" stroke="#1f2533" stroke-width="1" />

    <!-- Card: Done Item -->
    <g transform="translate(10, 46)" filter="url(#shadow)">
      <rect width="196" height="130" class="card-bg" />
      <rect x="12" y="12" width="24" height="16" rx="3" class="badge-p3" />
      <text x="16" y="24" class="badge-text">P3</text>
      <text x="44" y="24" class="text-muted">#INB-031</text>
      <text x="12" y="48" class="card-title">SQLCipher WAL configuration</text>
      <text x="12" y="66" class="text-body">Local encryption verified</text>
      <text x="12" y="80" class="text-body">Secure memory deletion active</text>
      <rect x="12" y="92" width="92" height="18" rx="3" fill="#132b21" stroke="#21523e" stroke-width="1" />
      <text x="16" y="104" font-family="JetBrains Mono, monospace" font-size="9" fill="#6ee7b7">Retention: 30d</text>
    </g>
  </g>
</svg>
